name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 target
        run: cmake --build build --config Release --target ZikadaFX_VST3

      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-vst3
          path: build/ZikadaFX_artefacts/Release/VST3
          if-no-files-found: error
