name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-packages:
    runs-on: windows-2022

    env:
      PRODUCT_NAME: ZIKADARATOR
      PRODUCT_VERSION: 0.1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate Windows plugin gate
        shell: pwsh
        run: |
          .\scripts\validate-windows.ps1 `
            -BuildDir build `
            -Configuration Release `
            -Generator "Visual Studio 17 2022" `
            -Architecture x64

      - name: Build plugin targets
        run: cmake --build build --config Release --target ZikadaFX_All

      - name: Upload Windows validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-validation-logs
          path: |
            build/pluginval-results
            build/Testing/Temporary
          if-no-files-found: ignore

      - name: Build Windows ZIP package
        shell: pwsh
        run: |
          $packageRoot = "packaging\windows\package-root"
          $artifactRoot = "packaging\windows\artifacts"
          Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "$packageRoot\VST3" | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageRoot\Standalone" | Out-Null
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          Copy-Item "build\ZikadaFX_artefacts\Release\VST3\$env:PRODUCT_NAME.vst3" "$packageRoot\VST3\" -Recurse -Force
          Copy-Item "build\ZikadaFX_artefacts\Release\Standalone\$env:PRODUCT_NAME.exe" "$packageRoot\Standalone\" -Force

          Compress-Archive -Path "$packageRoot\*" -DestinationPath "$artifactRoot\$env:PRODUCT_NAME-windows.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $innoDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6"
          $innoExe = Join-Path $innoDir "ISCC.exe"

          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $innoExe)) {
            choco install innosetup -y --no-progress
          }

          if (Test-Path -LiteralPath $innoExe) {
            Add-Content -Path $env:GITHUB_PATH -Value $innoDir
            & $innoExe /?
          } else {
            iscc.exe /?
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          iscc.exe /DMyAppName="${{ env.PRODUCT_NAME }}" /DMyAppVersion="${{ env.PRODUCT_VERSION }}" /DMySourceDir="$PWD\\packaging\\windows\\package-root" /DMyOutputDir="$PWD\\packaging\\windows\\artifacts" "packaging\\windows\\ZIKADARATOR.iss"

      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-vst3
          path: build/ZikadaFX_artefacts/Release/VST3
          if-no-files-found: error

      - name: Upload Windows ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-zip
          path: packaging/windows/artifacts/ZIKADARATOR-windows.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-installer
          path: packaging/windows/artifacts/ZIKADARATOR-Setup.exe
          if-no-files-found: error
