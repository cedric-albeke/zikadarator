name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-packages:
    runs-on: windows-2022

    env:
      PRODUCT_NAME: ZIKADARATOR
      PRODUCT_VERSION: 0.1.0
      SIGNING_STATUS: UNSIGNED - tester build only
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Syntax-check macOS validation script
        shell: bash
        run: bash -n scripts/validate-macos.sh

      - name: Validate Windows plugin gate
        shell: pwsh
        run: |
          .\scripts\validate-windows.ps1 `
            -BuildDir build `
            -Configuration Release `
            -Generator "Visual Studio 17 2022" `
            -Architecture x64

      - name: Build plugin targets
        run: cmake --build build --config Release --target ZikadaFX_All

      - name: Upload Windows validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-validation-logs
          path: |
            build/pluginval-results
            build/Testing/Temporary
          if-no-files-found: ignore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $innoDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6"
          $innoExe = Join-Path $innoDir "ISCC.exe"

          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $innoExe)) {
            choco install innosetup -y --no-progress
          }

          if (Test-Path -LiteralPath $innoExe) {
            Add-Content -Path $env:GITHUB_PATH -Value $innoDir
            & $innoExe /?
          } else {
            iscc.exe /?
          }

      - name: Sign Windows plugin binaries (if certificate available)
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = "$env:RUNNER_TEMP\\zikada-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $vst3Binary = "build\\ZikadaFX_artefacts\\Release\\VST3\\ZIKADARATOR.vst3\\Contents\\x86_64-win\\ZIKADARATOR.vst3"
          $standaloneExe = "build\\ZikadaFX_artefacts\\Release\\Standalone\\ZIKADARATOR.exe"
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22000.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $signtool) {
            throw "A Windows signing certificate was supplied, but signtool.exe was not found"
          }

          & $signtool sign /f $certPath /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a $vst3Binary
          if ($LASTEXITCODE -ne 0) { throw "VST3 binary signing failed" }
          & $signtool sign /f $certPath /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a $standaloneExe
          if ($LASTEXITCODE -ne 0) { throw "Standalone signing failed" }

          "SIGNING_STATUS=SIGNED with code signing certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Build Windows tester package
        shell: pwsh
        run: |
          .\scripts\package-windows-release.ps1 `
            -BuildDir build `
            -Configuration Release `
            -PackageName "packaging/windows/artifacts/ZIKADARATOR-windows" `
            -SigningStatus "$env:SIGNING_STATUS"

      - name: Build Windows installer
        shell: pwsh
        run: |
          iscc.exe /DMyAppName="${{ env.PRODUCT_NAME }}" /DMyAppVersion="${{ env.PRODUCT_VERSION }}" /DMySourceDir="$PWD\\packaging\\windows\\artifacts\\ZIKADARATOR-windows" /DMyOutputDir="$PWD\\packaging\\windows\\artifacts" "packaging\\windows\\ZIKADARATOR.iss"

      - name: Sign Windows installer (if certificate available)
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\\zikada-cert.pfx"
          $installerExe = "packaging\\windows\\artifacts\\ZIKADARATOR-Setup.exe"
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22000.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $signtool) {
            throw "A Windows signing certificate was supplied, but signtool.exe was not found"
          }

          & $signtool sign /f $certPath /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a $installerExe
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify packaged Windows ZIP
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "zikada-package-verify"
          Remove-Item $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "packaging\\windows\\artifacts\\ZIKADARATOR-windows.zip" $verifyRoot -Force
          & "$verifyRoot\\verify-checksums.ps1"

      - name: Create Windows build manifest
        shell: pwsh
        run: |
          $manifestPath = "packaging\\windows\\artifacts\\BUILD-INFO.txt"
          "Build: $env:SIGNING_STATUS" | Out-File $manifestPath
          "Product: ZIKADARATOR" | Add-Content $manifestPath
          "Version: $env:PRODUCT_VERSION" | Add-Content $manifestPath
          "Commit: $env:GITHUB_SHA" | Add-Content $manifestPath
          "Date: $(Get-Date -Format u)" | Add-Content $manifestPath

      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-vst3
          path: build/ZikadaFX_artefacts/Release/VST3
          if-no-files-found: error

      - name: Upload Windows ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-zip
          path: packaging/windows/artifacts/ZIKADARATOR-windows.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-windows-installer
          path: |
            packaging/windows/artifacts/ZIKADARATOR-Setup.exe
            packaging/windows/artifacts/BUILD-INFO.txt
          if-no-files-found: error
