name: Build macOS Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-macos-packages:
    runs-on: macos-14

    env:
      PRODUCT_NAME: ZIKADARATOR
      PRODUCT_VERSION: 0.1.0
      SIGNING_STATUS: UNSIGNED - tester build only
      NOTARIZATION_STATUS: NOT NOTARIZED
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate macOS plugin gate
        run: |
          BUILD_DIR=build \
          CONFIGURATION=Release \
          OSX_ARCHITECTURES="x86_64;arm64" \
          OSX_DEPLOYMENT_TARGET=11.0 \
          ./scripts/validate-macos.sh

      - name: Upload macOS validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-macos-validation-logs
          path: |
            build/pluginval-results
            build/Testing/Temporary
          if-no-files-found: ignore

      - name: Import macOS signing identities and sign plugin bundles
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/zikada-cert.p12"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/zikada.keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/zikada.keychain"
          security import "$RUNNER_TEMP/zikada-cert.p12" \
            -k "$RUNNER_TEMP/zikada.keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/zikada.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/zikada.keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_CERTIFICATE_PASSWORD" \
            "$RUNNER_TEMP/zikada.keychain"

          for artifact in \
            "build/ZikadaFX_artefacts/Release/VST3/${PRODUCT_NAME}.vst3" \
            "build/ZikadaFX_artefacts/Release/AU/${PRODUCT_NAME}.component" \
            "build/ZikadaFX_artefacts/Release/Standalone/${PRODUCT_NAME}.app"
          do
            codesign --force --deep --options runtime --timestamp \
              --sign "Developer ID Application" "$artifact"
            codesign --verify --deep --strict --verbose=2 "$artifact"
          done

          echo "SIGNING_STATUS=SIGNED with Developer ID" >> "$GITHUB_ENV"

      - name: Stage macOS package contents
        run: |
          rm -rf packaging/macos/stage packaging/macos/artifacts "packaging/macos/${PRODUCT_NAME}-macos"
          mkdir -p packaging/macos/stage/Library/Audio/Plug-Ins/VST3
          mkdir -p packaging/macos/stage/Library/Audio/Plug-Ins/Components
          mkdir -p packaging/macos/stage/Applications
          mkdir -p packaging/macos/artifacts

          cp -R "build/ZikadaFX_artefacts/Release/VST3/${PRODUCT_NAME}.vst3" "packaging/macos/stage/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/ZikadaFX_artefacts/Release/AU/${PRODUCT_NAME}.component" "packaging/macos/stage/Library/Audio/Plug-Ins/Components/"
          cp -R "build/ZikadaFX_artefacts/Release/Standalone/${PRODUCT_NAME}.app" "packaging/macos/stage/Applications/"

      - name: Verify staged signed macOS bundles
        if: env.MACOS_SIGNING_ENABLED == 'true'
        run: |
          for artifact in \
            "packaging/macos/stage/Library/Audio/Plug-Ins/VST3/${PRODUCT_NAME}.vst3" \
            "packaging/macos/stage/Library/Audio/Plug-Ins/Components/${PRODUCT_NAME}.component" \
            "packaging/macos/stage/Applications/${PRODUCT_NAME}.app"
          do
            codesign --verify --deep --strict --verbose=2 "$artifact"
          done

      - name: Build macOS ZIP package
        run: |
          cp -R packaging/macos/stage "packaging/macos/${PRODUCT_NAME}-macos"
          ditto -c -k --sequesterRsrc --keepParent "packaging/macos/${PRODUCT_NAME}-macos" packaging/macos/artifacts/${PRODUCT_NAME}-macos.zip

      - name: Build unsigned macOS installer package
        run: |
          pkgbuild \
            --root packaging/macos/stage \
            --identifier io.zikada.fx.installer \
            --version "${PRODUCT_VERSION}" \
            --scripts packaging/macos/scripts \
            packaging/macos/artifacts/${PRODUCT_NAME}-Installer.pkg

      - name: Sign and notarize final macOS installer
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          productsign --sign "Developer ID Installer" \
            "packaging/macos/artifacts/ZIKADARATOR-Installer.pkg" \
            "packaging/macos/artifacts/ZIKADARATOR-Installer-Signed.pkg"
          mv "packaging/macos/artifacts/ZIKADARATOR-Installer-Signed.pkg" \
            "packaging/macos/artifacts/ZIKADARATOR-Installer.pkg"
          pkgutil --check-signature "packaging/macos/artifacts/ZIKADARATOR-Installer.pkg"

          if [[ -n "$MACOS_NOTARIZATION_APPLE_ID" \
                && -n "$MACOS_NOTARIZATION_PASSWORD" \
                && -n "$MACOS_NOTARIZATION_TEAM_ID" ]]; then
            xcrun notarytool submit \
              "packaging/macos/artifacts/ZIKADARATOR-Installer.pkg" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --password "$MACOS_NOTARIZATION_PASSWORD" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
              --wait
            xcrun stapler staple "packaging/macos/artifacts/ZIKADARATOR-Installer.pkg"
            xcrun stapler validate "packaging/macos/artifacts/ZIKADARATOR-Installer.pkg"
            echo "NOTARIZATION_STATUS=NOTARIZED and stapled" >> "$GITHUB_ENV"
          fi

      - name: Remove temporary macOS signing keychain
        if: always() && env.MACOS_SIGNING_ENABLED == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$RUNNER_TEMP/zikada.keychain" || true
          rm -f "$RUNNER_TEMP/zikada-cert.p12"

      - name: Create macOS build manifest and checksums
        run: |
          echo "Build: ${SIGNING_STATUS}" > packaging/macos/artifacts/BUILD-INFO.txt
          echo "Notarization: ${NOTARIZATION_STATUS}" >> packaging/macos/artifacts/BUILD-INFO.txt
          echo "Product: ${PRODUCT_NAME}" >> packaging/macos/artifacts/BUILD-INFO.txt
          echo "Version: ${PRODUCT_VERSION}" >> packaging/macos/artifacts/BUILD-INFO.txt
          echo "Commit: ${GITHUB_SHA}" >> packaging/macos/artifacts/BUILD-INFO.txt
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> packaging/macos/artifacts/BUILD-INFO.txt
          (
            cd packaging/macos/artifacts
            shasum -a 256 \
              "${PRODUCT_NAME}-macos.zip" \
              "${PRODUCT_NAME}-Installer.pkg" \
              > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload macOS VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-macos-vst3
          path: build/ZikadaFX_artefacts/Release/VST3
          if-no-files-found: error

      - name: Upload macOS AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-macos-au
          path: build/ZikadaFX_artefacts/Release/AU
          if-no-files-found: error

      - name: Upload macOS ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-macos-zip
          path: |
            packaging/macos/artifacts/ZIKADARATOR-macos.zip
            packaging/macos/artifacts/BUILD-INFO.txt
            packaging/macos/artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZIKADARATOR-macos-installer
          path: |
            packaging/macos/artifacts/ZIKADARATOR-Installer.pkg
            packaging/macos/artifacts/BUILD-INFO.txt
            packaging/macos/artifacts/SHA256SUMS.txt
          if-no-files-found: error
